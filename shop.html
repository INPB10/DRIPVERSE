<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop — DRIPVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>

    .shop-page {
      min-height: 100vh;
      background: #f4f2ed;
      padding: 70px 5vw 110px;
    }

    .shop-heading {
      max-width: 1450px;
      margin: 0 auto;
      padding-bottom: 55px;
      border-bottom: 1px solid #d9d6ce;
    }

    .shop-eyebrow {
      margin: 0 0 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #77736c;
    }

    .shop-heading h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(55px, 8vw, 110px);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -4px;
    }

    .shop-heading h1 em {
      font-weight: 400;
    }

    .shop-heading p {
      max-width: 500px;
      margin: 25px 0 0;
      color: #77736c;
      font-size: 14px;
      line-height: 1.7;
    }

    .category-filter {
      max-width: 1450px;
      margin: 25px auto 45px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-filter button {
      padding: 10px 17px;
      border: 1px solid #cfcac0;
      background: transparent;
      color: #11110f;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s ease;
    }

    .category-filter button:hover,
    .category-filter button.active {
      background: #11110f;
      color: #fff;
      border-color: #11110f;
    }

    .shop-grid {
      max-width: 1450px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 35px 18px;
    }

    .shop-product {
      min-width: 0;
    }

    .shop-product-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .shop-product-image-wrap {
      position: relative;
      overflow: hidden;
      background: #e7e4dd;
      aspect-ratio: 4 / 5;
    }

    .shop-product-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .shop-product:hover .shop-product-image {
      transform: scale(1.035);
    }

    .shop-product-number {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #fff;
      mix-blend-mode: difference;
    }

    .shop-product-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      padding-top: 15px;
    }

    .shop-product-category {
      margin: 0 0 6px;
      font-size: 9px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #858178;
    }

    .shop-product-name {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .shop-product-price {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
    }

    .shop-empty {
      grid-column: 1 / -1;
      padding: 80px 20px;
      text-align: center;
      border-top: 1px solid #d9d6ce;
      border-bottom: 1px solid #d9d6ce;
    }

    .shop-empty h2 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 40px;
      font-weight: 400;
    }

    .shop-empty p {
      color: #77736c;
      font-size: 13px;
    }

    @media (max-width: 1000px) {

      .shop-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .shop-page {
        padding: 45px 20px 80px;
      }

      .shop-heading {
        padding-bottom: 35px;
      }

      .shop-heading h1 {
        font-size: 62px;
        letter-spacing: -2.5px;
      }

      .shop-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 30px 12px;
      }

      .shop-product-info {
        display: block;
      }

      .shop-product-price {
        display: block;
        margin-top: 7px;
      }

    }

    @media (max-width: 450px) {

      .shop-grid {
        grid-template-columns: 1fr 1fr;
      }

      .shop-product-name {
        font-size: 12px;
      }

      .shop-product-price {
        font-size: 12px;
      }

    }

  </style>

</head>


<body>


  <main class="shop-page">


    <section class="shop-heading">

      <p class="shop-eyebrow">
        DRIPVERSE / THE EDIT
      </p>

      <h1>
        Shop <em>the drop.</em>
      </h1>

      <p>
        Explore the current DRIPVERSE collection —
        everyday pieces, training essentials and
        modern street styles.
      </p>

    </section>


    <div class="category-filter">

      <button
        data-category="all"
        class="active"
      >
        All
      </button>

      <button data-category="gym">
        Gym Wear
      </button>

      <button data-category="men">
        Men's Wear
      </button>

      <button data-category="genz">
        Street Wear
      </button>

    </div>


    <section
      id="productGrid"
      class="shop-grid"
    ></section>


  </main>


  <script type="module">

    import {
      getProducts,
      getProductsByCategory
    } from "./js/products.js";


    const grid =
      document.getElementById("productGrid");

    const buttons =
      document.querySelectorAll(
        ".category-filter button"
      );


    function displayProducts(products) {

      grid.innerHTML = "";


      if (!products.length) {

        grid.innerHTML = `

          <div class="shop-empty">

            <h2>
              Nothing here yet.
            </h2>

            <p>
              New DRIPVERSE pieces are coming soon.
            </p>

          </div>

        `;

        return;

      }


      products.forEach((product, index) => {

        const card =
          document.createElement("article");

        card.className = "shop-product";


        card.innerHTML = `

          <a
            class="shop-product-link"
            href="product.html?id=${encodeURIComponent(product.id)}"
          >

            <div class="shop-product-image-wrap">

              <img
                class="shop-product-image"
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
              >

              <span class="shop-product-number">
                ${String(index + 1).padStart(2, "0")}
              </span>

            </div>


            <div class="shop-product-info">

              <div>

                <p class="shop-product-category">
                  ${product.category}
                </p>

                <h2 class="shop-product-name">
                  ${product.name}
                </h2>

              </div>

              <strong class="shop-product-price">
                ₹${product.price}
              </strong>

            </div>

          </a>

        `;


        grid.appendChild(card);

      });

    }


    function setCategory(category) {

      buttons.forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.category === category
        );

      });


      if (category === "all") {

        displayProducts(getProducts());

      } else {

        displayProducts(
          getProductsByCategory(category)
        );

      }

    }


    buttons.forEach(button => {

      button.addEventListener("click", () => {

        setCategory(
          button.dataset.category
        );

      });

    });


    const params =
      new URLSearchParams(
        window.location.search
      );

    const urlCategory =
      params.get("category");


    if (
      urlCategory === "gym" ||
      urlCategory === "men" ||
      urlCategory === "genz"
    ) {

      setCategory(urlCategory);

    } else {

      setCategory("all");

    }

  </script>


</body>

</html>
