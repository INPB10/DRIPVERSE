<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account — DRIPVERSE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"DM Sans",sans-serif;
background:#f5f2ec;
color:#111;
}


.account-page{

min-height:100vh;

display:grid;

grid-template-columns:1fr 450px;

}


/* LEFT BRAND */

.account-brand{

background:#111;

color:white;

display:flex;

flex-direction:column;

justify-content:center;

padding:80px;

position:relative;

overflow:hidden;

}


.account-brand:before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#333;

border-radius:50%;

right:-200px;

top:-150px;

opacity:.25;

animation:move 8s infinite alternate;

}


@keyframes move{

from{
transform:translateY(0);
}

to{
transform:translateY(80px);
}

}



.brand-title{

font-family:"Playfair Display",serif;

font-size:90px;

letter-spacing:-5px;

position:relative;

z-index:2;

}



.brand-quote{

font-family:"Playfair Display",serif;

font-size:28px;

font-style:italic;

margin-top:20px;

position:relative;

z-index:2;

}



.brand-small{

margin-top:40px;

font-size:11px;

letter-spacing:3px;

opacity:.6;

}


/* FORM */


.account-box{

display:flex;

align-items:center;

justify-content:center;

padding:35px;

}


.auth-card{

width:100%;

max-width:380px;

background:white;

padding:38px;

border-radius:24px;

box-shadow:0 25px 70px rgba(0,0,0,.08);

animation:fade .5s ease;

}


@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:none;
}

}



.auth-logo{

font-family:"Playfair Display",serif;

font-size:36px;

text-align:center;

letter-spacing:3px;

}



.subtitle{

text-align:center;

color:#777;

font-size:13px;

margin:10px 0 30px;

}



.tabs{

display:flex;

border-bottom:1px solid #ddd;

margin-bottom:25px;

}


.tab{

flex:1;

border:0;

background:none;

padding:12px;

font-weight:700;

cursor:pointer;

color:#888;

}



.tab.active{

color:#111;

border-bottom:2px solid #111;

}



.form{

display:none;

}


.form.active{

display:block;

}



label{

display:block;

font-size:12px;

font-weight:700;

margin:15px 0 7px;

}



input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:14px;

font-size:14px;

outline:none;

background:#faf9f6;

}



input:focus{

border-color:#111;

}



.submit-btn{

width:100%;

margin-top:25px;

padding:14px;

border:none;

border-radius:14px;

background:#111;

color:white;

font-size:11px;

font-weight:700;

letter-spacing:2px;

cursor:pointer;

transition:.25s;

}


.submit-btn:hover{

transform:translateY(-2px);

}



.message{

text-align:center;

font-size:13px;

margin-top:15px;

min-height:20px;

}



.back{

display:block;

text-align:center;

margin-top:25px;

font-size:13px;

font-weight:700;

}



@media(max-width:850px){

.account-page{

grid-template-columns:1fr;

}


.account-brand{

display:none;

}

}

</style>

</head>


<body>


<div class="account-page">


<section class="account-brand">

<div class="brand-title">
DRIPVERSE
</div>

<div class="brand-quote">
"Wear what feels like you."
</div>

<div class="brand-small">
CONSIDERED EVERYDAY ESSENTIALS
</div>

</section>



<section class="account-box">


<div class="auth-card">


<div class="auth-logo">
DRIPVERSE
</div>


<div class="subtitle">
Your account. Your style.
</div>



<div class="tabs">

<button id="loginTab" class="tab active">
LOGIN
</button>

<button id="signupTab" class="tab">
CREATE ACCOUNT
</button>

</div>



<form id="loginForm" class="form active">


<label>Email</label>

<input id="loginEmail" type="email" placeholder="Enter email" required>


<label>Password</label>

<input id="loginPassword" type="password" placeholder="Enter password" required>


<button class="submit-btn">
LOGIN
</button>


</form>




<form id="signupForm" class="form">


<label>Name</label>

<input id="signupName" type="text" placeholder="Your name" required>


<label>Email</label>

<input id="signupEmail" type="email" placeholder="Enter email" required>


<label>Password</label>

<input id="signupPassword" type="password" placeholder="Create password" minlength="8" required>


<button class="submit-btn">
CREATE ACCOUNT
</button>


</form>



<div id="authMessage" class="message"></div>


<a class="back" href="index.html">
← Back to DRIPVERSE
</a>


</div>


</section>


</div>



<script type="module">


import {login,signup} from "./js/auth.js";


const loginTab=document.getElementById("loginTab");
const signupTab=document.getElementById("signupTab");

const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");

const message=document.getElementById("authMessage");



function show(text,success=false){

message.textContent=text;

message.style.color=
success ? "green":"#c62828";

}



loginTab.onclick=()=>{

loginTab.classList.add("active");

signupTab.classList.remove("active");

loginForm.classList.add("active");

signupForm.classList.remove("active");

};



signupTab.onclick=()=>{

signupTab.classList.add("active");

loginTab.classList.remove("active");

signupForm.classList.add("active");

loginForm.classList.remove("active");

};




loginForm.addEventListener("submit",async e=>{

e.preventDefault();


const result=await login(
loginEmail.value.trim(),
loginPassword.value
);


if(result.success){

show("Login successful...",true);

setTimeout(()=>{

location.href="account.html";

},800);


}else{

show(result.message);

}


});




signupForm.addEventListener("submit",async e=>{

e.preventDefault();


const result=await signup(

signupName.value.trim(),

signupEmail.value.trim(),

signupPassword.value

);



if(result.success){

show("Account created...",true);

setTimeout(()=>{

location.href="account.html";

},800);


}else{

show(result.message);

}



});


</script>


</body>
</html>
