```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRIPVERSE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#111111;
}

/* HEADER */

header{
    height:80px;
    border-bottom:1px solid #eeeeee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:0 30px;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:5px;
}

.back{
    position:absolute;
    left:30px;
    text-decoration:none;
    color:#111;
    font-size:14px;
}

/* PRODUCT */

.product-page{
    max-width:1150px;
    margin:55px auto;
    padding:0 25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:65px;
}

.product-image{
    width:100%;
}

.product-image img{
    width:100%;
    max-height:650px;
    object-fit:cover;
    border-radius:20px;
    display:block;
}

.product-info{
    padding-top:20px;
}

.product-info h1{
    font-size:40px;
    line-height:1.1;
    margin-bottom:18px;
}

.price{
    font-size:25px;
    font-weight:700;
    margin-bottom:25px;
}

.description{
    color:#555;
    line-height:1.7;
    margin-bottom:30px;
}

.size-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:12px;
}

.sizes{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

.sizes button{
    width:52px;
    height:48px;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.sizes button.active{
    background:#111;
    color:#fff;
    border-color:#111;
}

.buy-btn{
    width:100%;
    padding:17px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.buy-btn:hover{
    opacity:.9;
}

/* SUGGESTIONS */

.suggestions{
    max-width:1150px;
    margin:20px auto 80px;
    padding:0 25px;
}

.suggestions h2{
    font-size:28px;
    margin-bottom:25px;
}

.suggest-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.suggest-card{
    text-decoration:none;
    color:#111;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 22px rgba(0,0,0,.07);
    transition:.2s;
}

.suggest-card:hover{
    transform:translateY(-3px);
}

.suggest-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.suggest-info{
    padding:15px;
}

.suggest-info h3{
    font-size:16px;
    margin-bottom:7px;
}

.suggest-info p{
    font-weight:700;
}

/* MOBILE */

@media(max-width:700px){

    header{
        height:70px;
        padding:0 15px;
    }

    .back{
        left:15px;
    }

    .logo{
        font-size:20px;
        letter-spacing:4px;
    }

    .product-page{
        grid-template-columns:1fr;
        gap:30px;
        margin-top:25px;
        padding:0 15px;
    }

    .product-info{
        padding-top:0;
    }

    .product-info h1{
        font-size:30px;
    }

    .suggestions{
        padding:0 15px;
        margin-top:50px;
    }

    .suggest-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .suggest-info{
        padding:11px;
    }

    .suggest-info h3{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>

<a href="products.html" class="back">← Shop</a>

<div class="logo">DRIPVERSE</div>

</header>


<main>

<section class="product-page">

<div class="product-image">
<img id="productImage" src="" alt="Product">
</div>


<div class="product-info">

<h1 id="productName">Product</h1>

<div class="price" id="productPrice">₹0</div>

<p class="description" id="productDescription">
Premium DRIPVERSE clothing made for everyday wear.
</p>

<div class="size-title">SELECT SIZE</div>

<div class="sizes">
<button>S</button>
<button>M</button>
<button>L</button>
<button>XL</button>
</div>

<button class="buy-btn" onclick="buyNow()">
BUY NOW
</button>

</div>

</section>


<section class="suggestions">

<h2>You may also like</h2>

<div class="suggest-grid">

<a href="product.html?id=gym-black-tee" class="suggest-card">

<img src="images/gym-black.jpg" alt="Black Gym Tee">

<div class="suggest-info">
<h3>DRIPVERSE Black Gym Tee</h3>
<p>₹799</p>
</div>

</a>


<a href="product.html?id=oversized-white" class="suggest-card">

<img src="images/white-tee.jpg" alt="Oversized White Tee">

<div class="suggest-info">
<h3>Oversized White Tee</h3>
<p>₹699</p>
</div>

</a>


<a href="product.html?id=gym-white-tee" class="suggest-card">

<img src="images/gym-white.jpg" alt="White Gym Tee">

<div class="suggest-info">
<h3>White Gym Tee</h3>
<p>₹799</p>
</div>

</a>


<a href="product.html?id=genz-black" class="suggest-card">

<img src="images/genz-black.jpg" alt="GenZ Black Tee">

<div class="suggest-info">
<h3>GenZ Black Tee</h3>
<p>₹749</p>
</div>

</a>

</div>

</section>

</main>


<script>

const products = {

"gym-black-tee":{
name:"DRIPVERSE Black Gym Tee",
price:"₹799",
image:"images/gym-black.jpg",
description:"Premium gym wear designed for comfort, movement and everyday training."
},

"oversized-white":{
name:"Oversized White Tee",
price:"₹699",
image:"images/white-tee.jpg",
description:"A clean oversized fit made for everyday street style."
},

"gym-white-tee":{
name:"DRIPVERSE White Gym Tee",
price:"₹799",
image:"images/gym-white.jpg",
description:"Lightweight gym wear with a clean premium look."
},

"genz-black":{
name:"GenZ Black Tee",
price:"₹749",
image:"images/genz-black.jpg",
description:"A modern everyday tee inspired by GenZ fashion."
}

};


const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const product = products[id];

if(product){

document.getElementById("productName").textContent = product.name;
document.getElementById("productPrice").textContent = product.price;
document.getElementById("productDescription").textContent = product.description;
document.getElementById("productImage").src = product.image;

}


/* SIZE SELECTION */

document.querySelectorAll(".sizes button").forEach(button => {

button.addEventListener("click", () => {

document.querySelectorAll(".sizes button")
.forEach(b => b.classList.remove("active"));

button.classList.add("active");

});

});


/* BUY NOW */

function buyNow(){

const selected =
document.querySelector(".sizes button.active");

if(!selected){
alert("Please select a size first.");
return;
}

alert(
"Selected size: " +
selected.textContent +
"\n\nCheckout will be connected next."
);

}

</script>

</body>
</html>
```
