<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product — DRIPVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f2ed;
      color: #11110f;
      font-family: "DM Sans", Arial, sans-serif;
    }

    .product-page {
      min-height: 100vh;
      padding: 65px 5vw 100px;
    }

    .product-detail {
      max-width: 1450px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(350px, .85fr);
      gap: clamp(45px, 7vw, 110px);
      align-items: start;
    }

    /* IMAGE */

    .product-visual {
      position: relative;
    }

    .product-main-image {
      width: 100%;
      display: block;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #e7e4dd;
      border-radius: 4px;
    }

    /* PRODUCT INFO */

    .product-detail-info {
      padding-top: 25px;
      position: sticky;
      top: 25px;
    }

    .detail-number {
      color: #858178;
      font-size: 10px;
      letter-spacing: 2.5px;
      margin-bottom: 35px;
    }

    .detail-category {
      color: #77736c;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .product-detail-info h1 {
      margin: 0;
      max-width: 650px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(42px, 5vw, 70px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -2px;
    }

    .detail-price {
      margin-top: 27px;
      font-size: 18px;
      font-weight: 700;
    }

    .detail-description {
      max-width: 520px;
      margin-top: 25px;
      color: #6f6b63;
      font-size: 14px;
      line-height: 1.8;
    }

    .detail-divider {
      width: 100%;
      height: 1px;
      background: #d9d6ce;
      margin: 36px 0;
    }

    /* SIZE */

    .size-title {
      margin-bottom: 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sizes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .size-button {
      min-width: 54px;
      height: 44px;
      padding: 0 15px;
      border: 1px solid #c9c6be;
      border-radius: 11px;
      background: transparent;
      color: #11110f;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .size-button:hover {
      border-color: #11110f;
    }

    .size-button.active {
      background: #11110f;
      color: #fff;
      border-color: #11110f;
    }

    /* ACTIONS */

    .product-actions {
      display: flex;
      gap: 10px;
      margin-top: 23px;
    }

    .cart-button,
    .buy-button {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: .25s ease;
    }

    .cart-button {
      border: 1px solid #11110f;
      background: #fff;
      color: #11110f;
    }

    .cart-button:hover:not(:disabled) {
      background: #11110f;
      color: #fff;
      transform: translateY(-2px);
    }

    .buy-button {
      border: 1px solid #11110f;
      background: #11110f;
      color: #fff;
    }

    .buy-button:hover:not(:disabled) {
      background: #2b2a27;
      transform: translateY(-2px);
    }

    .cart-button:disabled,
    .buy-button:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }

    .product-message {
      min-height: 18px;
      margin-top: 13px;
      color: #77736c;
      font-size: 12px;
    }

    /* META */

    .product-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 30px;
    }

    .meta-box {
      border-top: 1px solid #d9d6ce;
      padding-top: 12px;
      color: #77736c;
      font-size: 9px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    /* RECOMMENDATIONS */

    .recommendations {
      max-width: 1450px;
      margin: 105px auto 0;
    }

    .recommend-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 32px;
    }

    .recommend-label {
      margin: 0 0 8px;
      color: #77736c;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .recommend-title {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 400;
      line-height: 1;
    }

    .recommend-title em {
      font-style: italic;
    }

    .recommend-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .recommend-card {
      display: block;
      overflow: hidden;
      background: #fff;
      color: #11110f;
      text-decoration: none;
      border-radius: 16px;
      transition: .3s ease;
    }

    .recommend-card:hover {
      transform: translateY(-5px);
    }

    .recommend-image {
      width: 100%;
      aspect-ratio: 1 / 1.08;
      object-fit: cover;
      display: block;
      background: #e7e4dd;
    }

    .recommend-info {
      padding: 17px 18px 20px;
    }

    .recommend-category {
      margin: 0 0 7px;
      color: #77736c;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .recommend-info h3 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.1;
    }

    .recommend-price {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    /* NOT FOUND */

    .not-found {
      max-width: 700px;
      margin: 120px auto;
      text-align: center;
    }

    .not-found h1 {
      margin: 15px 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 50px;
      font-weight: 400;
    }

    .not-found a {
      color: #11110f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .product-page {
        padding: 35px 20px 70px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .product-detail-info {
        position: static;
        padding-top: 0;
      }

      .product-detail-info h1 {
        font-size: 48px;
      }

      .recommendations {
        margin-top: 75px;
      }

    }

    @media (max-width: 600px) {

      .product-actions {
        flex-direction: column;
      }

      .cart-button,
      .buy-button {
        width: 100%;
      }

      .recommend-heading {
        display: block;
      }

      .recommend-grid {
        grid-template-columns: 1fr;
      }

      .product-detail-info h1 {
        font-size: 41px;
      }

      .product-main-image {
        aspect-ratio: 1 / 1.15;
      }

    }

  </style>

</head>


<body>


<main class="product-page">

  <div id="productContainer"></div>

  <section
    id="recommendations"
    class="recommendations"
    style="display:none;"
  >

    <div class="recommend-heading">

      <div>

        <p class="recommend-label">
          THE CURRENT EDIT
        </p>

        <h2 class="recommend-title">
          You may also <em>like.</em>
        </h2>

      </div>

    </div>

    <div
      id="recommendGrid"
      class="recommend-grid"
    ></div>

  </section>

</main>



<script type="module">

  import {
    getProducts,
    getProductById
  } from "./js/products.js";


  const params =
    new URLSearchParams(window.location.search);

  const productId =
    params.get("id");

  const product =
    getProductById(productId);

  const container =
    document.getElementById("productContainer");

  const recommendations =
    document.getElementById("recommendations");

  const recommendGrid =
    document.getElementById("recommendGrid");


  /* PRODUCT NOT FOUND */

  if (!product) {

    container.innerHTML = `

      <div class="not-found">

        <p class="detail-category">
          DRIPVERSE / ERROR
        </p>

        <h1>
          Product not found.
        </h1>

        <a href="shop.html">
          ← BACK TO SHOP
        </a>

      </div>

    `;

  } else {


    /* PRODUCT */

    container.innerHTML = `

      <div class="product-detail">


        <div class="product-visual">

          <img
            class="product-main-image"
            src="${product.image}"
            alt="${product.name}"
          >

        </div>


        <div class="product-detail-info">


          <div class="detail-number">
            DRIPVERSE / PRODUCT
          </div>


          <div class="detail-category">
            ${product.category}
          </div>


          <h1>
            ${product.name}
          </h1>


          <div class="detail-price">
            ₹${product.price}
          </div>


          <p class="detail-description">
            ${product.description}
          </p>


          <div class="detail-divider"></div>


          <div class="size-title">
            Select Size
          </div>


          <div class="sizes">

            ${product.sizes.map(size => `

              <button
                class="size-button"
                data-size="${size}"
                type="button"
              >
                ${size}
              </button>

            `).join("")}

          </div>


          <div class="product-actions">

            <button
              id="cartButton"
              class="cart-button"
              type="button"
              disabled
            >
              ADD TO CART
            </button>


            <button
              id="buyButton"
              class="buy-button"
              type="button"
              disabled
            >
              SELECT A SIZE
            </button>

          </div>


          <div
            id="productMessage"
            class="product-message"
          ></div>


          <div class="product-meta">

            <div class="meta-box">
              Online payment only
            </div>

            <div class="meta-box">
              No returns
            </div>

          </div>


        </div>

      </div>

    `;


    let selectedSize = null;


    const sizeButtons =
      document.querySelectorAll(".size-button");

    const cartButton =
      document.getElementById("cartButton");

    const buyButton =
      document.getElementById("buyButton");

    const message =
      document.getElementById("productMessage");


    /* SIZE */

    sizeButtons.forEach(button => {

      button.addEventListener("click", () => {

        sizeButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedSize =
          button.dataset.size;

        cartButton.disabled = false;

        buyButton.disabled = false;

        buyButton.textContent =
          "BUY NOW";

        message.textContent = "";

      });

    });


    /* ADD TO CART */

    function addToCart() {

      if (!selectedSize) return false;


      const cart =
        JSON.parse(
          localStorage.getItem("dripverse_cart") || "[]"
        );


      /*
        If the same product + size already exists,
        increase its quantity instead of creating
        another separate item.
      */

      const existing =
        cart.find(item =>
          item.id === product.id &&
          item.size === selectedSize
        );


      if (existing) {

        existing.quantity =
          (existing.quantity || 1) + 1;

      } else {

        cart.push({

          id: product.id,

          name: product.name,

          price: product.price,

          image: product.image,

          size: selectedSize,

          quantity: 1

        });

      }


      localStorage.setItem(
        "dripverse_cart",
        JSON.stringify(cart)
      );


      return true;

    }


    /* ADD TO CART BUTTON */

    cartButton.addEventListener("click", () => {

      if (!selectedSize) return;


      addToCart();


      message.textContent =
        `${product.name} added to your cart ✓`;


      cartButton.textContent =
        "ADDED ✓";


      setTimeout(() => {

        cartButton.textContent =
          "ADD TO CART";

      }, 1500);

    });


    /* BUY NOW */

    buyButton.addEventListener("click", () => {

      if (!selectedSize) return;


      addToCart();


      window.location.href =
        "cart.html";

    });


    /* RECOMMENDED PRODUCTS */

    const recommended =
      getProducts()
        .filter(item => item.id !== product.id)
        .slice(0, 3);


    if (recommended.length > 0) {

      recommendations.style.display =
        "block";


      recommendGrid.innerHTML =
        recommended.map(item => `

          <a
            class="recommend-card"
            href="product.html?id=${encodeURIComponent(item.id)}"
          >

            <img
              class="recommend-image"
              src="${item.image}"
              alt="${item.name}"
              loading="lazy"
            >

            <div class="recommend-info">

              <p class="recommend-category">
                ${item.category}
              </p>

              <h3>
                ${item.name}
              </h3>

              <div class="recommend-price">
                ₹${item.price}
              </div>

            </div>

          </a>

        `).join("");

    }

  }

</script>


</body>

</html>
