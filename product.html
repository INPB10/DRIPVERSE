<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product — DRIPVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>

    .product-page {
      min-height: 100vh;
      background: #f4f2ed;
      padding: 70px 5vw 100px;
    }

    .product-detail {
      max-width: 1450px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr);
      gap: clamp(45px, 7vw, 120px);
      align-items: start;
    }

    .product-visual {
      position: relative;
    }

    .product-main-image {
      width: 100%;
      display: block;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #e7e4dd;
    }

    .product-detail-info {
      padding-top: 35px;
      position: sticky;
      top: 30px;
    }

    .detail-number {
      font-size: 11px;
      letter-spacing: 2px;
      color: #858178;
      margin-bottom: 35px;
    }

    .detail-category {
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-size: 11px;
      color: #77736c;
      margin-bottom: 15px;
    }

    .product-detail-info h1 {
      margin: 0;
      max-width: 600px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(42px, 5vw, 72px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -2px;
    }

    .detail-price {
      margin-top: 28px;
      font-size: 18px;
      font-weight: 600;
    }

    .detail-description {
      max-width: 520px;
      margin-top: 28px;
      color: #6f6b63;
      font-size: 14px;
      line-height: 1.8;
    }

    .detail-divider {
      width: 100%;
      height: 1px;
      background: #d9d6ce;
      margin: 38px 0;
    }

    .size-title {
      margin-bottom: 15px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .sizes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .size-button {
      min-width: 58px;
      height: 48px;
      padding: 0 18px;
      border: 1px solid #c9c6be;
      background: transparent;
      color: #11110f;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .size-button:hover {
      border-color: #11110f;
    }

    .size-button.active {
      background: #11110f;
      color: #fff;
      border-color: #11110f;
    }

    .buy-button {
      width: 100%;
      height: 58px;
      margin-top: 25px;
      border: 0;
      background: #11110f;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: .2s ease;
    }

    .buy-button:hover:not(:disabled) {
      background: #2a2926;
    }

    .buy-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .product-message {
      margin-top: 14px;
      color: #77736c;
      font-size: 12px;
    }

    .product-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 30px;
    }

    .meta-box {
      border-top: 1px solid #d9d6ce;
      padding-top: 13px;
      font-size: 10px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: #77736c;
    }

    .not-found {
      max-width: 700px;
      margin: 100px auto;
      text-align: center;
    }

    .not-found h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 48px;
      font-weight: 400;
    }

    .not-found a {
      display: inline-block;
      margin-top: 20px;
      color: #111;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    @media (max-width: 850px) {

      .product-page {
        padding: 35px 20px 70px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .product-detail-info {
        padding-top: 0;
        position: static;
      }

      .product-detail-info h1 {
        font-size: 48px;
      }

    }

    @media (max-width: 500px) {

      .product-detail-info h1 {
        font-size: 40px;
      }

      .product-main-image {
        aspect-ratio: 1 / 1.15;
      }

    }

  </style>

</head>


<body>

  <main class="product-page">

    <div id="productContainer" class="product-detail"></div>

  </main>


  <script type="module">

    import {
      getProductById
    } from "./js/products.js";


    const params = new URLSearchParams(
      window.location.search
    );

    const productId = params.get("id");

    const product = getProductById(productId);

    const container =
      document.getElementById("productContainer");


    if (!product) {

      container.innerHTML = `

        <div class="not-found">

          <p class="detail-category">
            DRIPVERSE / ERROR
          </p>

          <h1>
            Product not found.
          </h1>

          <a href="shop.html">
            ← BACK TO SHOP
          </a>

        </div>

      `;

    } else {

      container.innerHTML = `

        <div class="product-visual">

          <img
            class="product-main-image"
            src="${product.image}"
            alt="${product.name}"
          >

        </div>


        <div class="product-detail-info">

          <div class="detail-number">
            DRIPVERSE / PRODUCT
          </div>

          <div class="detail-category">
            ${product.category}
          </div>

          <h1>
            ${product.name}
          </h1>

          <div class="detail-price">
            ₹${product.price}
          </div>

          <p class="detail-description">
            ${product.description}
          </p>

          <div class="detail-divider"></div>

          <div class="size-title">
            Select Size
          </div>

          <div class="sizes">

            ${product.sizes.map(size => `

              <button
                class="size-button"
                data-size="${size}"
                type="button"
              >
                ${size}
              </button>

            `).join("")}

          </div>


          <button
            id="buyButton"
            class="buy-button"
            type="button"
            disabled
          >
            SELECT A SIZE
          </button>


          <div
            id="productMessage"
            class="product-message"
          ></div>


          <div class="product-meta">

            <div class="meta-box">
              Online payment only
            </div>

            <div class="meta-box">
              No returns
            </div>

          </div>

        </div>

      `;


      let selectedSize = null;


      const sizeButtons =
        document.querySelectorAll(".size-button");

      const buyButton =
        document.getElementById("buyButton");


      sizeButtons.forEach(button => {

        button.addEventListener("click", () => {

          sizeButtons.forEach(btn => {
            btn.classList.remove("active");
          });

          button.classList.add("active");

          selectedSize = button.dataset.size;

          buyButton.disabled = false;

          buyButton.textContent = "BUY NOW";

        });

      });


      buyButton.addEventListener("click", () => {

        if (!selectedSize) return;


        const cart = JSON.parse(
          localStorage.getItem("dripverse_cart") || "[]"
        );


        cart.push({

          id: product.id,
          name: product.name,
          price: product.price,
          image: product.image,
          size: selectedSize,
          quantity: 1

        });


        localStorage.setItem(
          "dripverse_cart",
          JSON.stringify(cart)
        );


        window.location.href = "cart.html";

      });

    }

  </script>

</body>

</html>
