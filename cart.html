<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart — DRIPVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>

    .cart-page {
      min-height: 100vh;
      background: #f4f2ed;
      padding: 70px 5vw 110px;
    }

    .cart-container {
      max-width: 1450px;
      margin: auto;
    }

    .cart-heading {
      padding-bottom: 45px;
      border-bottom: 1px solid #d9d6ce;
    }

    .cart-eyebrow {
      margin: 0 0 18px;
      color: #77736c;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .cart-title {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(55px, 8vw, 100px);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -4px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 70px;
      margin-top: 45px;
      align-items: start;
    }

    .cart-items {
      min-width: 0;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      gap: 25px;
      padding: 0 0 25px;
      margin-bottom: 25px;
      border-bottom: 1px solid #d9d6ce;
    }

    .cart-image-wrap {
      background: #e7e4dd;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .cart-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .cart-item-info {
      padding-top: 4px;
    }

    .cart-category {
      margin: 0 0 9px;
      color: #858178;
      font-size: 9px;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .cart-item-name {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 25px;
      font-weight: 400;
      line-height: 1.1;
    }

    .cart-size {
      margin-top: 14px;
      color: #77736c;
      font-size: 12px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      margin-top: 25px;
      border: 1px solid #cfcac0;
    }

    .quantity-control button {
      width: 35px;
      height: 35px;
      border: 0;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
    }

    .quantity-control span {
      min-width: 35px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }

    .cart-item-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      min-height: 145px;
    }

    .cart-item-price {
      font-size: 14px;
      font-weight: 600;
    }

    .remove-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #77736c;
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    .remove-button:hover {
      color: #11110f;
    }

    .summary {
      position: sticky;
      top: 30px;
      background: #11110f;
      color: #fff;
      padding: 32px;
    }

    .summary-label {
      margin: 0 0 28px;
      color: #aaa79f;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,.15);
      font-size: 13px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    .summary-note {
      margin: 20px 0 0;
      color: #aaa79f;
      font-size: 11px;
      line-height: 1.7;
    }

    .checkout-button {
      width: 100%;
      height: 55px;
      margin-top: 28px;
      border: 0;
      background: #f4f2ed;
      color: #11110f;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    .checkout-button:hover {
      background: #fff;
    }

    .empty-cart {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
    }

    .empty-cart h2 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 52px;
      font-weight: 400;
    }

    .empty-cart p {
      margin: 15px 0 0;
      color: #77736c;
      font-size: 13px;
    }

    .empty-cart a {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 25px;
      background: #11110f;
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    @media (max-width: 900px) {

      .cart-layout {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .summary {
        position: static;
      }

    }

    @media (max-width: 600px) {

      .cart-page {
        padding: 45px 20px 80px;
      }

      .cart-title {
        font-size: 62px;
        letter-spacing: -2.5px;
      }

      .cart-item {
        grid-template-columns: 95px minmax(0, 1fr);
        gap: 15px;
      }

      .cart-item-right {
        grid-column: 2;
        min-height: auto;
        flex-direction: row;
        align-items: center;
      }

      .cart-item-name {
        font-size: 20px;
      }

      .quantity-control {
        margin-top: 18px;
      }

      .summary {
        padding: 25px;
      }

      .empty-cart h2 {
        font-size: 40px;
      }

    }

  </style>

</head>


<body>

  <main class="cart-page">

    <div class="cart-container">

      <header class="cart-heading">

        <p class="cart-eyebrow">
          DRIPVERSE / BAG
        </p>

        <h1 class="cart-title">
          Your cart.
        </h1>

      </header>


      <div id="cartContent"></div>

    </div>

  </main>


  <script>

    const cartContent =
      document.getElementById("cartContent");


    function getCart() {

      return JSON.parse(
        localStorage.getItem("dripverse_cart") || "[]"
      );

    }


    function saveCart(cart) {

      localStorage.setItem(
        "dripverse_cart",
        JSON.stringify(cart)
      );

    }


    function changeQuantity(index, change) {

      const cart = getCart();

      if (!cart[index]) return;

      cart[index].quantity =
        Math.max(
          1,
          (cart[index].quantity || 1) + change
        );

      saveCart(cart);

      renderCart();

    }


    function removeItem(index) {

      const cart = getCart();

      cart.splice(index, 1);

      saveCart(cart);

      renderCart();

    }


    function renderCart() {

      const cart = getCart();


      if (!cart.length) {

        cartContent.innerHTML = `

          <div class="empty-cart">

            <h2>
              Your cart is empty.
            </h2>

            <p>
              Nothing here yet. Discover the latest DRIPVERSE pieces.
            </p>

            <a href="shop.html">
              EXPLORE THE SHOP
            </a>

          </div>

        `;

        return;

      }


      let total = 0;


      const items = cart.map((item, index) => {

        const quantity =
          item.quantity || 1;

        const itemTotal =
          item.price * quantity;

        total += itemTotal;


        return `

          <article class="cart-item">

            <div class="cart-image-wrap">

              <img
                class="cart-image"
                src="${item.image}"
                alt="${item.name}"
              >

            </div>


            <div class="cart-item-info">

              <p class="cart-category">
                DRIPVERSE / ${item.id.split("-")[0]}
              </p>

              <h2 class="cart-item-name">
                ${item.name}
              </h2>

              <p class="cart-size">
                Size — ${item.size}
              </p>


              <div class="quantity-control">

                <button
                  type="button"
                  onclick="changeQuantity(${index}, -1)"
                  aria-label="Decrease quantity"
                >
                  −
                </button>

                <span>
                  ${quantity}
                </span>

                <button
                  type="button"
                  onclick="changeQuantity(${index}, 1)"
                  aria-label="Increase quantity"
                >
                  +
                </button>

              </div>

            </div>


            <div class="cart-item-right">

              <strong class="cart-item-price">
                ₹${itemTotal}
              </strong>

              <button
                class="remove-button"
                type="button"
                onclick="removeItem(${index})"
              >
                REMOVE
              </button>

            </div>

          </article>

        `;

      }).join("");


      cartContent.innerHTML = `

        <div class="cart-layout">

          <section class="cart-items">

            ${items}

          </section>


          <aside class="summary">

            <p class="summary-label">
              Order summary
            </p>

            <div class="summary-row">

              <span>
                Subtotal
              </span>

              <span>
                ₹${total}
              </span>

            </div>

            <div class="summary-row">

              <span>
                Delivery
              </span>

              <span>
                Calculated at checkout
              </span>

            </div>


            <div class="summary-total">

              <span>
                Total
              </span>

              <span>
                ₹${total}
              </span>

            </div>


            <p class="summary-note">
              Online payment only. Orders are verified
              within 2–3 hours after payment.
            </p>


            <button
              class="checkout-button"
              type="button"
              onclick="checkout()"
            >
              PROCEED TO CHECKOUT
            </button>

          </aside>

        </div>

      `;

    }


    function checkout() {

      alert(
        "Online checkout will be connected next."
      );

    }


    renderCart();

  </script>

</body>

</html>
