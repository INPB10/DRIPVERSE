<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart — DRIPVERSE</title>

<link rel="stylesheet" href="css/style.css">


<style>

.cart-page {
  min-height:100vh;
  background:#f7f6f2;
  padding:70px 25px;
}


.cart-wrapper {
  max-width:1200px;
  margin:auto;
}


.cart-title {
  font-family:"Playfair Display",serif;
  font-size:55px;
  margin-bottom:45px;
}


/* layout */

.cart-layout {

display:grid;
grid-template-columns:1.5fr .8fr;
gap:35px;

}


/* items */

.cart-items {

display:flex;
flex-direction:column;
gap:18px;

}


.cart-card {

background:white;
border:1px solid #e6e3dc;
border-radius:22px;
padding:18px;

display:flex;
gap:22px;

animation:fade .5s ease;

}


@keyframes fade {

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:none;
}

}



.cart-image {

width:130px;
height:130px;
border-radius:16px;
object-fit:cover;
background:#eee;

}



.cart-info {

flex:1;

}


.cart-info h3 {

font-size:20px;
margin-bottom:8px;

}


.cart-info span {

color:#777;
font-size:14px;

}


.price {

font-weight:800;
margin-top:12px;

}



.remove {

margin-top:15px;

border:none;
background:#f2f2f2;

padding:8px 15px;

border-radius:20px;

cursor:pointer;

font-size:12px;

}




/* summary */


.summary {

background:white;

border:1px solid #e6e3dc;

border-radius:25px;

padding:30px;

height:max-content;

}



.summary h2 {

font-size:25px;

margin-bottom:25px;

}



.row {

display:flex;

justify-content:space-between;

margin:15px 0;

color:#555;

}



.total {

font-size:20px;
font-weight:800;
color:#111;

border-top:1px solid #ddd;

padding-top:20px;

}



.checkout {

width:100%;

margin-top:25px;

padding:14px;

border:none;

border-radius:30px;

background:#111;

color:white;

font-weight:700;

letter-spacing:1px;

cursor:pointer;

transition:.3s;

}


.checkout:hover {

transform:translateY(-3px);

}




.info-box {

margin-top:25px;

background:#f7f6f2;

padding:18px;

border-radius:18px;

font-size:13px;

color:#666;

line-height:1.6;

}



/* empty */

.empty {

background:white;

border-radius:25px;

padding:70px 30px;

text-align:center;

}



.empty a {

display:inline-block;

margin-top:20px;

background:#111;

color:white;

padding:13px 25px;

border-radius:30px;

}




@media(max-width:800px){

.cart-layout{

grid-template-columns:1fr;

}


.cart-title{

font-size:40px;

}


.cart-card{

flex-direction:column;

}


.cart-image{

width:100%;
height:280px;

}

}


</style>

</head>



<body>



<header class="site-header">

<a href="index.html" class="brand">
DRIPVERSE
</a>


<nav class="main-nav">

<a href="shop.html?category=men">
MEN'S WEAR
</a>

<a href="shop.html?category=gym">
GYM WEAR
</a>

<a href="shop.html?category=genz">
STREET WEAR
</a>

</nav>



<div class="nav-actions">


<a href="https://instagram.com/dripverse_co/" target="_blank" class="icon-link">
◎
</a>


<a href="account.html" class="icon-link">
◯
</a>


<a href="cart.html" class="icon-link">
🛒
</a>


</div>


</header>




<main class="cart-page">


<div class="cart-wrapper">


<h1 class="cart-title">
Your Cart
</h1>



<div id="cartContent"></div>


</div>


</main>




<script>


const container =
document.getElementById("cartContent");



function getCart(){

return JSON.parse(
localStorage.getItem("dripverse_cart") || "[]"
);

}




function renderCart(){


const cart=getCart();



if(cart.length===0){


container.innerHTML=`

<div class="empty">

<h2>Your cart is empty</h2>

<p>
Discover something new from DRIPVERSE.
</p>


<a href="shop.html">
SHOP NOW
</a>


</div>

`;

return;

}



let total=0;



let products=cart.map((item,index)=>{


total += item.price * item.quantity;



return `

<div class="cart-card">


<img 
src="${item.image}"
class="cart-image"
>


<div class="cart-info">


<h3>${item.name}</h3>


<span>
Size: ${item.size}
</span>


<div class="price">
₹${item.price}
</div>


<button 
class="remove"
onclick="removeItem(${index})"
>
REMOVE
</button>


</div>


</div>


`;

}).join("");




container.innerHTML=`


<div class="cart-layout">


<div class="cart-items">

${products}

</div>




<div class="summary">


<h2>
Order Summary
</h2>



<div class="row">

<span>
Subtotal
</span>

<span>
₹${total}
</span>

</div>


<div class="row">

<span>
Delivery
</span>

<span>
FREE
</span>

</div>



<div class="row total">

<span>
Total
</span>

<span>
₹${total}
</span>


</div>



<button class="checkout"
onclick="checkout()">

CHECKOUT

</button>



<div class="info-box">

✓ Secure online payment

<br>

✓ Order verified within 2–3 hours

<br>

✓ No returns

</div>


</div>



</div>



`;



}




function removeItem(index){

let cart=getCart();

cart.splice(index,1);


localStorage.setItem(
"dripverse_cart",
JSON.stringify(cart)
);


renderCart();


}




function checkout(){

alert(
"Payment gateway will be connected soon."
);

}



renderCart();



</script>


</body>

</html>
